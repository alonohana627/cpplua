# Builds cpplua with clang and libc++ on Windows (MSYS2 CLANG64) and Ubuntu
# (x86-64), runs every test, then checks every way of installing it
# (.github/scripts/verify_install.sh). The packages it makes are kept as
# artifacts; pushing a tag v<version> also publishes them as a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSYS2 CLANG64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git
          pacboy: clang:p cmake:p ninja:p

      - name: Configure
        run: cmake --preset release -DCPPLUA_REFERENCE_LUA=OFF

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release -j 4

      - name: Verify installs
        run: .github/scripts/verify_install.sh build/release

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: |
            build/release/*.zip
            build/release/*.zip.sha256
          if-no-files-found: error

  ubuntu:
    name: Ubuntu (x86-64)
    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: 23
      CXX: clang++-23
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and libc++
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "libc++-$LLVM_VERSION-dev" "libc++abi-$LLVM_VERSION-dev" ninja-build pkg-config
          "$CXX" --version

      - name: Configure
        run: >
          cmake --preset release -DCPPLUA_REFERENCE_LUA=OFF
          -DCMAKE_C_COMPILER=clang-$LLVM_VERSION -DCMAKE_CXX_COMPILER=$CXX

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release -j 4

      - name: Verify installs
        run: .github/scripts/verify_install.sh build/release

      - uses: actions/upload-artifact@v4
        with:
          name: packages-ubuntu
          path: |
            build/release/*.tar.gz
            build/release/*.deb
            build/release/*.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag must name the version the packages were built as.
          ls "packages/cpplua-${TAG#v}-linux-x86_64.tar.gz"
          prerelease=""
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" \
            --title "cpplua ${TAG#v}" --generate-notes $prerelease
